<?php
    use NumenCode\Fundamentals\Classes\CmsPermissions;
?>
<div data-control="toolbar">
    <?php if (CmsPermissions::canCreate($this)): ?>
        <a href="<?= $this->getWidgetUrl('create') ?>" class="btn btn-primary wn-icon-plus">
            <?= e(trans($this->asExtension('FormController')->getConfig('create[title]', 'backend::lang.form.create'))) ?>
        </a>
    <?php endif ?>

    <?php if (CmsPermissions::canDelete($this)): ?>
        <button
            class="btn btn-danger wn-icon-trash-o"
            disabled="disabled"
            onclick="$(this).data('request-data', { checked: $('.control-list').listWidget('getChecked') })"
            data-request="onDelete"
            data-request-confirm="<?= e(trans('backend::lang.list.delete_selected_confirm')) ?>"
            data-trigger-action="enable"
            data-trigger=".control-list input[type=checkbox]"
            data-trigger-condition="checked"
            data-request-success="$(this).prop('disabled', 'disabled')"
            data-stripe-load-indicator
        >
            <?= e(trans('backend::lang.list.delete_selected')) ?>
        </button>
    <?php endif ?>
</div>
