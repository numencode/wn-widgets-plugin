# ===================================
#  Form Field Definitions
# ===================================

fields:
    id:
        type: number
        cssClass: hidden
    title:
        label: 'numencode.fundamentals::lang.field.title'
        type: text
        span: left
    subtitle:
        label: 'numencode.fundamentals::lang.field.subtitle'
        type: text
        span: right
    content:
        label: 'numencode.fundamentals::lang.field.content'
        type: richeditor
        size: large
        span: full
    picture:
        label: 'numencode.fundamentals::lang.field.picture'
        type: mediafinder
        mode: image
        span: left
    link:
        label: 'numencode.fundamentals::lang.field.link'
        type: text
        span: right
    link_title:
        label: 'numencode.fundamentals::lang.field.link_title'
        type: text
        span: right
    is_published:
        label: 'numencode.fundamentals::lang.field.is_published'
        comment: 'numencode.fundamentals::lang.field.is_published_comment'
        type: switch
        default: true
        span: left
